<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Budget Tracker</h1>
        <form action="" id="budget-form">
            <label for="description">Description</label>
            <input type="text" name="description" id="description" placeholder="Expense Description">
            <span id="description-error" class="error-message"></span>

            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Expense Amount" required min="0.01" step="0.01">

            <label for="category">Category</label>
            <select name="category" id="category">
                <option class="category-option" value="Groceries">Groceries</option>
                <option class="category-option" value="Rent">Rent</option>
                <option class="category-option" value="Entertainment">Entertainment</option>
            </select>
            <button type="submit" id="add-expense">Add Expense</button>
        </form>

        <ul id="expense-list"></ul>
    </div>
</body>
</html>
